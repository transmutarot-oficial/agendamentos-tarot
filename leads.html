<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Leads - Tarot</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1a1a2e; color: #fff; padding: 20px; }
        .container { max-width: 700px; margin: 0 auto; background-color: #16213e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1 { color: #e94560; text-align: center; font-size: 24px; }
        .instructions { background-color: #0f3460; padding: 15px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; text-align: center; }
        button { width: 100%; background-color: #e94560; color: white; border: none; padding: 12px 15px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; transition: 0.3s; margin-bottom: 20px; }
        button:hover { background-color: #d13d56; }
        .lead-card { background-color: #0f3460; border-left: 5px solid #e94560; padding: 15px; margin-top: 15px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .lead-info { margin-bottom: 10px; }
        .lead-info p { margin: 5px 0; font-size: 15px; }
        .whatsapp-btn { background-color: #25D366; color: white; text-decoration: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; display: inline-block; transition: 0.3s; }
        .whatsapp-btn:hover { background-color: #128C7E; }
        /* Nova classe para quando o botão for clicado (Fica Vermelho) */
        .whatsapp-btn.chamado { background-color: #dc3545 !important; }
        .whatsapp-btn.chamado:hover { background-color: #c82333 !important; }
        
        .empty-state { text-align: center; margin-top: 20px; font-style: italic; color: #aaa; }
        /* Estilo do contador */
        .contador-box { background-color: #0f3460; border: 1px solid #e94560; color: #e94560; padding: 15px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔮 Leads do Dia - Tiragem 5 Estrelas</h1>
        
        <div class="instructions">
            <p>Clique no botão abaixo para carregar e ordenar as interessadas de hoje.</p>
        </div>

        <button onclick="carregarLeads()">Buscar Leads de Hoje</button>
        
        <div id="leadsContainer"></div>
    </div>

    <script>
        // Link direto da planilha!
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQUCRqIfEk3e-Pxma_GzUHd0As-TNp5VBtMDKOLJ-im2vIxlnohh-SyFdoCzh3X78LPOMwVQeBPMx5z/pub?gid=111972384&single=true&output=csv';

        async function carregarLeads() {
            const container = document.getElementById('leadsContainer');
            container.innerHTML = '<p class="empty-state">Buscando leads...</p>';

            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("Falha no download da planilha");
                
                const text = await response.text();
                processarCSV(text);
                
            } catch (error) {
                container.innerHTML = '';
                alert("Erro ao carregar! Verifique o console para mais detalhes.");
                console.error("Erro completo:", error);
            }
        }

        function processarCSV(csvText) {
            const linhas = csvText.split(/\r?\n/);
            const container = document.getElementById('leadsContainer');
            container.innerHTML = '';

            const hoje = new Date().toLocaleDateString('pt-BR'); 
            let leadsDoDia = [];
            let telefonesUnicos = new Set(); // SET para rastrear números únicos e não contar duplicatas!

            // 1) Novo Leitor de CSV Inteligente para não quebrar com vírgulas extras do Google
            function parseCSVLine(str) {
                var arr = [];
                var quote = false;
                var col = '';
                var sep = linhas[0].includes(';') ? ';' : ','; 
                for (var i = 0; i < str.length; i++) {
                    var cc = str[i], nc = str[i+1];
                    // Pula as aspas que estão escapando outras aspas
                    if (cc === '"' && quote && nc === '"') { col += '"'; i++; continue; }
                    // Alterna o estado de estar dentro ou fora de aspas
                    if (cc === '"') { quote = !quote; continue; }
                    // Se achou o separador e NÃO está dentro de aspas, corta a coluna
                    if (cc === sep && !quote) { arr.push(col.trim()); col = ''; continue; }
                    col += cc;
                }
                arr.push(col.trim());
                // Remove aspas nas bordas caso tenha sobrado
                return arr.map(c => c.replace(/^"|"$/g, '').trim());
            }

            // Garante que estamos pegando a coluna certa, independente da ordem
            const cabecalho = parseCSVLine(linhas[0].toLowerCase());
            let idxData = cabecalho.findIndex(c => c.includes('data') || c.includes('carimbo'));
            let idxNome = cabecalho.findIndex(c => c.includes('nome'));
            let idxWhats = cabecalho.findIndex(c => c.includes('whatsapp') || c.includes('whats'));

            // Fallback caso ele não consiga ler o cabeçalho direito
            if(idxData === -1) idxData = 0;
            if(idxNome === -1) idxNome = 1;
            if(idxWhats === -1) idxWhats = 2;

            for (let i = 1; i < linhas.length; i++) {
                if (!linhas[i].trim()) continue;
                
                const colunas = parseCSVLine(linhas[i]);
                
                if (colunas.length > idxWhats) {
                    const dataHora = colunas[idxData];
                    let nome = colunas[idxNome];
                    let whatsapp = colunas[idxWhats];

                    // Verifica se a data contém a data de hoje
                    if (dataHora && dataHora.includes(hoje)) {
                        
                        let numLimpo = whatsapp ? whatsapp.replace(/\D/g, '') : '';
                        if (numLimpo.length === 10 || numLimpo.length === 11) {
                            numLimpo = '55' + numLimpo;
                        }
                        
                        // Adiciona o número limpo ao SET (se o número já existir, o SET ignora automaticamente, não duplicando)
                        if (numLimpo) {
                            telefonesUnicos.add(numLimpo);
                        }

                        const primeiroNome = nome ? nome.split(' ')[0] : 'Lindona';
                        
                        // Extrai a hora exata da coluna pra podermos ordenar
                        let matchHora = dataHora.match(/\d{2}:\d{2}(:\d{2})?/);
                        let horaString = matchHora ? matchHora[0] : "00:00:00";
                        
                        // Salva os dados na nossa lista ao invés de já jogar na tela
                        leadsDoDia.push({
                            dataHoraOriginal: dataHora,
                            horaString: horaString,
                            nome: nome || 'Sem nome',
                            primeiroNome: primeiroNome,
                            whatsappLimpo: numLimpo
                        });
                    }
                }
            }

            // (1) ALTERAÇÃO DE ORDEM: De cima para baixo (do mais recente/tarde pro mais cedo)
            leadsDoDia.sort((a, b) => {
                if (a.horaString < b.horaString) return 1;  // Invertido o 1 com -1
                if (a.horaString > b.horaString) return -1;
                return 0;
            });
            
            // (3) ALTERAÇÃO: Contador de leads totais sem duplicatas
            const totalLeadsUnicos = telefonesUnicos.size;
            container.innerHTML = `<div class="contador-box">🚀 Total de Leads Únicos Hoje: ${totalLeadsUnicos}</div>`;

            if (leadsDoDia.length === 0) {
                container.innerHTML += `<p class="empty-state">Nenhum lead encontrado para a data de hoje (${hoje}).</p>`;
                return;
            }

            // Gera os bloquinhos HTML na tela baseados na lista ordenada
            leadsDoDia.forEach(lead => {
                const mensagem = `Boa noite ${lead.primeiroNome}! Notificou aqui pra mim no meu site que você tinha se interessado na minha tiragem pra hoje, das 05 estrelas do amor por R$45. Ainda tenho o último horário do dia disponível, e pra fechar minha agenda pra hoje, faço até por R$29 no pix se ainda tiver interesse, e ai eu enviaria a tiragem aqui já pronta umas 23:30. \n\nTô chamando agora aqui no whats você e outra duas meninas que também tinham se interessado nesse último pacote do dia, me avisa aqui se tiver interesse que ela é sua. Se não eu repasso pra outras meninas sem problemas, é que você colocou seu numero antes delas no site, então vim aqui primeiro kkkkkkk`;
                
                // Criação corrigida do link do Whats com o numero limpo
                const linkWa = `https://wa.me/${lead.whatsappLimpo}?text=${encodeURIComponent(mensagem)}`;

                const card = document.createElement('div');
                card.className = 'lead-card';
                card.innerHTML = `
                    <div class="lead-info">
                        <p><strong>👤 ${lead.nome}</strong></p>
                        <p>🕒 ${lead.dataHoraOriginal}</p>
                        <p>📱 ${lead.whatsappLimpo}</p>
                    </div>
                    <!-- (2) ALTERAÇÃO: onclick que adiciona a classe 'chamado' para o botão ficar vermelho -->
                    <a href="${linkWa}" target="_blank" class="whatsapp-btn" onclick="this.classList.add('chamado'); this.innerHTML='✓ Whats Chamado';">💬 Chamar no Whats</a>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
